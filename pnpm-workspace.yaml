packages:
  - apps/*
  - packages/*
  - scripts

# Install only versions published at least 7 days ago (in minutes).
minimumReleaseAge: 10080
saveExact: true
engineStrict: true

# Dependency install scripts run only when listed here as true. esbuild and msw
# work without theirs.
allowBuilds:
  esbuild: false
  msw: false

# GHSA-fc5q-39xc-vjpf (picomatch ReDoS, high) has no patched version. It
# reaches only dev tools (typescript-eslint, vitest); `pnpm audit --prod` is
# clean. The Operator approved this waiver on 2026-11-18. Review it by
# 2026-12-18, and remove it as soon as a patched version is published.
auditConfig:
  ignoreGhsas:
    - GHSA-fc5q-39xc-vjpf
