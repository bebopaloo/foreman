# A production-like preview of the current checkout, on this machine only.
# Start it with the stack-ts `preview` skill, or:
#   PREVIEW_PORT=8100 docker compose -f compose.preview.yaml -p <name> up -d --build --wait
# The database has no host port, and the web port binds to 127.0.0.1.
# The database accepts connections without a password (trust) and only the
# Compose network can reach it. Never use these settings for a shared or hosted
# environment.
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build: { context: ., target: api }
    command: ["node", "apps/api/src/migrate.ts"]
    environment:
      DATABASE_URL: postgres://app@db:5432/app
    depends_on:
      db: { condition: service_healthy }

  api:
    build: { context: ., target: api }
    environment:
      DATABASE_URL: postgres://app@db:5432/app
      HOST: 0.0.0.0
      PORT: "3000"
      CORS_ORIGINS: http://127.0.0.1:${PREVIEW_PORT:-8100}
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 30

  web:
    build: { context: ., target: web }
    ports:
      - "127.0.0.1:${PREVIEW_PORT:-8100}:80"
    depends_on:
      api: { condition: service_healthy }
