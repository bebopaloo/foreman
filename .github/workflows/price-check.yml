# Compares data/price-table.json with the public pricing page each week. The script
# writes a report file only when it finds a difference or cannot parse a page. The
# report is data from the script, so it goes to `gh` as a file, never in a shell string.
name: price-check

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: price-check
  cancel-in-progress: false

jobs:
  price-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The runner context is not available in job-level env, so each step sets
      # REPORT_FILE. Only the last step gets the token that can write issues.
      - name: Compare the price table with the pricing page
        env:
          REPORT_FILE: ${{ runner.temp }}/price-check-report.md
        run: pnpm price-check "$REPORT_FILE"
      - name: Open an issue or comment on the open one
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPORT_FILE: ${{ runner.temp }}/price-check-report.md
        run: |
          if [ ! -s "$REPORT_FILE" ]; then
            echo "No differences."
            exit 0
          fi
          if ! gh label list --limit 200 --json name --jq '.[].name' | grep -qx 'price-check'; then
            gh label create price-check --color FBCA04 \
              --description "The price table differs from the public pricing page"
          fi
          number=$(gh issue list --label price-check --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file "$REPORT_FILE"
          else
            gh issue create --label price-check \
              --title "Price check: the price table differs from the pricing page" \
              --body-file "$REPORT_FILE"
          fi
