# Dev and production stay apart (ADR 0015, work item R8.2). context-init writes this
# file to .github/workflows/release-separation.yml at the switch-over to Releases.
#
# A pull request and the main branch have no human review before production, so no
# workflow that they run may use the production environment. This check fails when
# a workflow other than deploy-production.yml uses it, or when deploy-production.yml
# runs on anything other than a push to production or a workflow_dispatch. The
# Machine gate needs every check, so a failure here stops the merge.
name: release-separation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  separation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Only the production deploy uses the production environment
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          PRODUCTION = re.compile(r"^\s*environment:\s*(?:\{\s*name:\s*)?['\"]?production['\"]?\s*\}?\s*(?:#.*)?$"
                                  r"|^\s*environment:\s*\n\s+name:\s*['\"]?production['\"]?", re.MULTILINE)
          TRIGGER = re.compile(r"^on:\s*\n((?:[ \t]+.*\n|\s*\n)+)", re.MULTILINE)
          problems = []
          for path in sorted(pathlib.Path(".github/workflows").glob("*.y*ml")):
              text = path.read_text()
              if path.name == "deploy-production.yml":
                  trigger = TRIGGER.search(text)
                  events = set(re.findall(r"^  ([\w-]+):", trigger.group(1), re.MULTILINE)) if trigger else set()
                  if not trigger or events - {"push", "workflow_dispatch"}:
                      problems.append(f"{path}: runs on {sorted(events)}; only push to production and workflow_dispatch")
                  elif not re.search(r"^  push:\s*\n    branches:\s*\[\s*production\s*\]", trigger.group(1), re.MULTILINE):
                      problems.append(f"{path}: a push deploys only from the production branch")
              elif PRODUCTION.search(text):
                  problems.append(f"{path}: uses the production environment; only deploy-production.yml may")
          for problem in problems:
              print(f"::error::{problem}")
          sys.exit(1 if problems else 0)
          PY
